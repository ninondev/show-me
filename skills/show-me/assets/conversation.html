<style>
  #__VIEW_ID__ { display: grid; gap: calc(var(--font-size-base, 16px) * 1); }
  #__VIEW_ID__ .sm-heading { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: calc(var(--font-size-base, 16px) * .5); padding-inline-end: 90px; }
  #__VIEW_ID__ .sm-field { display: grid; gap: calc(var(--font-size-base, 16px) * .5); min-width: 0; }
  #__VIEW_ID__ .sm-actions { display: flex; flex-wrap: wrap; align-items: center; gap: calc(var(--font-size-base, 16px) * .5); }
  #__VIEW_ID__ .sm-spacer { flex: 1; }
  #__VIEW_ID__ .sm-original { white-space: pre-wrap; overflow-wrap: anywhere; margin-block-start: calc(var(--font-size-base, 16px) * .5); }
  #__VIEW_ID__ .sm-result { display: grid; gap: calc(var(--font-size-base, 16px) * .5); }
  #__VIEW_ID__ [data-result-text] { white-space:pre-wrap; overflow-wrap:anywhere; }
  #__VIEW_ID__ [hidden] { display: none; }
  @media(max-width:480px) {
    #__VIEW_ID__ .sm-actions { display:grid; grid-template-columns:1fr auto; }
    #__VIEW_ID__ [data-suggestion] { grid-column:1 / -1; justify-self:start; }
    #__VIEW_ID__ .sm-spacer { display:none; }
    #__VIEW_ID__ [data-reset] { justify-self:start; }
  }
</style>
<section id="__VIEW_ID__" aria-label="Edit the current answer" data-ui>
  <div class="sm-heading"><label class="form-label" for="__VIEW_ID__-text" data-label></label><span class="text-small" data-context></span></div>
  <div class="sm-field">
    <textarea class="form-control" id="__VIEW_ID__-text" rows="4" maxlength="4000" aria-describedby="__VIEW_ID__-status"></textarea>
    <details><summary>Original wording</summary><p class="sm-original" data-original></p></details>
  </div>
  <div class="sm-actions">
    <button class="btn" type="button" data-suggestion>Try a shorter version</button>
    <span class="sm-spacer"></span>
    <button class="btn btn-ghost" type="button" data-reset disabled>Reset</button>
    <button class="btn btn-primary" type="button" data-submit disabled>Use this</button>
  </div>
  <p class="text-small" id="__VIEW_ID__-status" role="status" aria-live="polite"></p>
  <div class="sm-result" data-result hidden><h3>Updated sample</h3><p data-result-text></p><button class="btn" type="button" data-again>Edit again</button></div>
  <noscript>You can describe the change in the chat.</noscript>
</section>
<script>__CONVERSATION_CORE__</script>
<script>__HOST_CORE__</script>
<script>
(() => {
  const boot = __CONVERSATION_BOOT__;
  const root = document.getElementById('__VIEW_ID__');
  const $ = selector => root.querySelector(selector);
  const editor = $('textarea'), status = $('[role="status"]');
  const submit = $('[data-submit]'), reset = $('[data-reset]'), suggest = $('[data-suggestion]');
  const api = window.ShowMeConversation;
  let session = boot.session, original = session.fields[0].value, draftTouched = false;
  const host = boot.host === 'demo' ? null : window.ShowMeHosts.connect(boot.host, session, window, boot.local);
  let connection, sentPacket = null, restoredState = 'ready', saveTimer;
  const ownSubmissions = new Set();
  let sampleValue = original;
  let strings = boot.strings, label = boot.label, suggestion = boot.suggestion, statusKey;
  function say(key) { statusKey = key; status.textContent = strings[key]; }
  function translate() {
    root.setAttribute('aria-label', strings.region);
    $('[data-label]').textContent = label;
    $('[data-context]').textContent = boot.host === 'demo' ? strings.local : '';
    $('summary').textContent = strings.original;
    suggest.textContent = strings.shorter;
    reset.textContent = strings.reset;
    $('[data-result] h3').textContent = strings.result;
    $('[data-again]').textContent = strings.again;
    $('noscript').textContent = strings.noScript;
    if (statusKey) say(statusKey);
  }
  $('[data-original]').textContent = original;
  editor.value = original;
  suggest.hidden = !suggestion;
  const hostAvailable = () => boot.host === 'demo' || host.available;

  function update() {
    const changed = editor.value !== original;
    const locked = restoredState !== 'ready' || connection?.state !== 'ready';
    submit.disabled = locked || !hostAvailable() || !changed;
    reset.disabled = locked || !changed;
    suggest.disabled = locked;
    editor.readOnly = locked;
    submit.textContent = locked ? strings.checkChat : strings.submit;
    if (boot.host === 'demo' && locked) submit.textContent = strings.applied;
  }

  function save() {
    if (!host) return;
    const snapshot = {
      modelContent: null,
      privateContent: {showMe: {task: session.task, revision: session.revision, draft: editor.value, state: restoredState !== 'ready' ? restoredState : connection.state, submission: sentPacket?.submission || null}}
    };
    if (new TextEncoder().encode(JSON.stringify(snapshot)).length >= 16000) {
      say('tooLarge');
      return;
    }
    try { Promise.resolve(host.saveState(snapshot)).catch(() => {
      say('saveFailed');
    }); } catch (_) { say('saveFailed'); }
  }

  function restore(saved) {
    const value = saved?.privateContent?.showMe;
    if (!value || value.task !== session.task || value.revision !== session.revision || typeof value.draft !== 'string' || value.draft.length > 4000) return;
    if (ownSubmissions.has(value.submission)) return;
    if (!draftTouched) editor.value = value.draft;
    if (['sending', 'sent', 'unknown'].includes(value.state)) {
      restoredState = value.state;
      say(value.state === 'sent' ? 'restoredSent' : 'restoredUnknown');
    } else if (!draftTouched) say('restored');
  }

  function connect() {
    connection = api.connect(session, async (message, packet) => {
      sentPacket = packet;
      ownSubmissions.add(packet.submission);
      save();
      if (host) return host.send(message, packet);
      api.validate(session, packet);
      const change = packet.changes[0];
      if (sampleValue !== change.before) throw new Error('The sample changed. Reopen it before applying this edit.');
      sampleValue = change.after;
      $('[data-result-text]').textContent = sampleValue;
      $('[data-result]').hidden = false;
    });
  }
  connect();
  say(hostAvailable() ? (boot.host === 'demo' ? 'idleDemo' : 'idleChat') : 'unavailable');
  if (host) restore(host.readState());
  translate();
  update();

  editor.addEventListener('input', () => {
    draftTouched = true;
    clearTimeout(saveTimer);
    say(editor.value === original ? 'originalRestored' : 'draft');
    editor.removeAttribute('aria-invalid');
    update();
    saveTimer = setTimeout(save, 350);
  });
  editor.addEventListener('blur', () => { if (draftTouched) save(); });
  suggest.addEventListener('click', () => {
    editor.value = suggestion; draftTouched = true;
    say('suggestion');
    editor.removeAttribute('aria-invalid'); update(); save(); editor.focus();
  });
  reset.addEventListener('click', () => {
    editor.value = original; draftTouched = true;
    editor.removeAttribute('aria-invalid');
    say('originalRestored'); update(); save(); editor.focus();
  });
  submit.addEventListener('click', async () => {
    if (submit.disabled) return;
    try { api.prepare(session, {[session.fields[0].id]: editor.value}); }
    catch (_) { say(editor.value.trim() ? 'invalid' : 'empty'); editor.setAttribute('aria-invalid', 'true'); editor.focus(); return; }
    draftTouched = true;
    say(boot.host === 'demo' ? 'sendingDemo' : 'sendingChat');
    const sending = connection.submit({[session.fields[0].id]: editor.value});
    update();
    try {
      const result = await sending;
      say(result.status === 'cancelled' ? 'cancelled' : boot.host === 'demo' ? 'doneDemo' : 'doneChat');
    } catch (_) {
      say(boot.host === 'demo' ? 'failedDemo' : 'failedChat');
    }
    update(); save();
  });
  $('[data-again]').addEventListener('click', () => {
    session = {...session, revision: crypto.randomUUID(), fields: [{...session.fields[0], value: sampleValue}]};
    original = sampleValue; restoredState = 'ready'; sentPacket = null;
    $('[data-original]').textContent = original; editor.value = original;
    $('[data-result]').hidden = true;
    connect(); say('editingAgain'); update(); editor.focus();
  });
  root.addEventListener('showme:locale', event => {
    if (boot.host !== 'demo') return;
    const next = event.detail;
    if (!next?.strings || Object.keys(boot.strings).some(key => typeof next.strings[key] !== 'string')) return;
    strings = next.strings; label = strings.label; suggestion = next.sample.suggestion;
    // Only untouched sample content changes language. User wording and adopted results stay exact.
    if (!draftTouched && connection.state === 'ready') {
      original = sampleValue = next.sample.value;
      session = {...session, revision: 'sample-' + next.language, fields: [{...session.fields[0], value: original}]};
      editor.value = original; editor.lang = next.language;
      $('[data-original]').textContent = original;
      connect();
    }
    translate(); update();
  });
  if (host) host.subscribe(saved => { restore(saved); update(); });
})();
</script>
